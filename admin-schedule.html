<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>QU Student Management System - Admin Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<body>
    <header class="main-header">
        <div class="header-left">
            <img src="images/logo qu.png" alt="Qatar University Logo" class="small-logo">
            <h1>CSE Department Administration</h1>
        </div>
        <div class="header-right">
            <div class="header-username"><!-- Dynamically Load Username --></div>
            <button class="btn btn-logout">Logout</button>
        </div>
    </header>

    <div class="container">
        <nav class="sidebar">
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="admin-home.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                </li>
                <li class="nav-item active">
                    <a href="admin-schedule.html"><i class="fas fa-calendar"></i> Schedule</a>
                </li>
            </ul>
        </nav>

        <main class="content">
            <section class="admin-header">
                <div class="admin-title">
                    <h2>Courses Schedule</h2>
                    <p>View and supervise course listings aligned to match the schedule of the admin.</p>
                </div>
                <div class="admin-actions">
                    <button class="btn btn-primary" id="createCourseBtn">
                        <i class="fas fa-plus"></i> Create New Course
                    </button>
                    <button class="btn btn-secondary" id="createClassBtn">
                        <i class="fas fa-plus"></i> Create New Class
                    </button>
                </div>
            </section>

        </main>
    </div>

    <footer class="main-footer">
        <p>&copy; 2024 Qatar University - CSE Department. All rights reserved.</p>
