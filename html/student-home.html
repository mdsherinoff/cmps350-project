<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QU Student Management System - Home</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <header class="main-header">
        <div class="header-left">
            <img src="../images/logo qu.png" alt="Qatar University Logo" class="small-logo">
            <h1>CSE Student Management</h1>
        </div>
        <div class="header-right">
            <div class="header-username"><!-- Dynamically Load Username --></div>
            <button class="btn btn-logout">Logout</button>
        </div>
    </header>

    <div class="container">
        <nav class="sidebar">
            <ul class="nav-menu">
                <li class="nav-item active">
                    <a href="student-home.html"><i class="fas fa-home"></i> Home</a>
                </li>
                <li class="nav-item">
                    <a href="learningPath.html"><i class="fas fa-graduation-cap"></i> Learning Path</a>
                </li>
            </ul>
        </nav>

        <main class="content">
            <section class="search-section">
                <h2>Available Courses</h2>
                <div class="search-container">
                    <div class="search-box">
                        <input type="text" name="" id="search-course" placeholder="Search courses...">
                    </div>
                    <div class="filter-container">
                        <label for="category-filter">Filter by:</label>
                        <select id="category-filter">
                            <option value="all">All Categories</option>
                            <option value="Programming">Programming</option>
                            <option value="Mathematics">Mathematics</option>
                            <option value="Systems">Systems</option>
                            <option value="Web & Data">Web & Data</option>
                            <option value="Software Engineering">Software Engineering</option>
                            <option value="AI & Advanced Tech">Artificial Intelligence</option>
                        </select>
                    </div>
                </div>
            </section>

            <section class="courses-grid">

        </main>
    </div>

    <footer class="main-footer">
        <p>&copy; 2024 Qatar University - CSE Department. All rights reserved.</p>
    </footer>
    <script src="../js/student.js"></script>
    <!-- <script src="js/main.js"></script> -->


</body>

</html>
