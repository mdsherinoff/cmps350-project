<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QU Student Management System - Admin Dashboard</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/admin-styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <header class="main-header">
        <div class="header-left">
            <img src="../images/logo qu.png" alt="Qatar University Logo" class="small-logo">
            <h1>CSE Department Administration</h1>
        </div>
        <div class="header-right">
            <div class="header-username"><!-- Dynamically Load Username --></div>
            <button class="btn btn-logout">Logout</button>
        </div>
    </header>

    <div class="container">
        <nav class="sidebar">
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="admin-home.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                </li>
                <li class="nav-item active">
                    <a href="admin-schedule.html"><i class="fas fa-calendar"></i> Schedule</a>
                </li>
            </ul>
        </nav>

        <main class="content">
            <section class="admin-header">
                <div class="admin-title">
                    <h2>Courses Schedule <span style="color: maroon;">In Progress</span></h2>
                    <p>View and supervise course listings, currently in progress, aligned to match the schedule of the
                        admin.</p>
                </div>
            </section>

            <section class="schedule-section">
                <div class="schedule-header">
                    <button class="tab-btn active" data-tab="all-days" id="all-days-button">All days</button>
                    <button class="tab-btn" data-tab="specific-days" id="specific-days-button">Specific Days</button>


                    <select class="days-filter">
                        <option value="all">All Days</option>
                        <option value="sun">Sunday</option>
                        <option value="mon">Monday</option>
                        <option value="tue">Tuesday</option>
                        <option value="wed">Wednesday</option>
                        <option value="thu">Thursday</option>
                        <option value="fri">Friday</option>
                        <option value="sat">Saturday</option>
                    </select>

                    <select class="category-filter">
                        <option value="all">All Categories</option>
                        <option value="Programming">Programming</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="Systems">Systems</option>
                        <option value="Web & Data">Web & Data</option>
                        <option value="Software Engineering">Software Engineering</option>
                        <option value="AI & Advanced Tech">Artificial Intelligence</option>
                    </select>
                </div>
                <div class="schedule-grid" id="schedule-grid">
                    <!-- Schedule for the day(s) will be dynamically loaded here -->
                </div>

    </div>

       

    </section>

    </main>
    </div>

    <footer class="main-footer">
        <p>&copy; 2024 Qatar University - CSE Department. All rights reserved.</p>
    </footer>

    <div class="modal" id="createCourseModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Create New Course</h3>
                <button class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="createCourseForm">
                    Form fields will be here
                </form>
            </div>
        </div>
    </div> -->

    <script src="../js/schedule.js"></script>
</body>

</html>
